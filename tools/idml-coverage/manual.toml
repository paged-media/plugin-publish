# Hand-kept facts the syn walk in tools/idml-coverage cannot see.
#
# Every entry is checked against the code: a literal named here must still
# appear in the item named here, and a fn must still exist, or the tool fails.
# See README.md for what each table means.

# ------------------------------------------------------------- importer

# A function's element(s), where call-site inference cannot tell.

[[fn]]
file = "crates/idml-import/src/story.rs"
name = "make_anchored_frame"
# `anchored_kind_from_name`: the inline-anchored page items.
elements = ["TextFrame", "Rectangle", "Group"]

[[fn]]
file = "crates/idml-import/src/util.rs"
name = "record_item_name"
# `NAMED_ITEM_KINDS`.
elements = ["TextFrame", "Rectangle", "Oval", "Polygon", "GraphicLine", "Group"]

# `(N, b"Child")` arms in the story parser: which element's <Properties>
# kind N is (`properties_kind` = 1 inside a run, 2 inside a paragraph).

[[properties_kind]]
file = "crates/idml-import/src/story.rs"
kind = 1
element = "CharacterStyleRange"

[[properties_kind]]
file = "crates/idml-import/src/story.rs"
kind = 2
element = "ParagraphStyleRange"
# InDesign's record-form tab stop: <TabList><ListItem type="record">.
rename = { Position = "TabList/ListItem/Position", Alignment = "TabList/ListItem/Alignment", AlignmentCharacter = "TabList/ListItem/AlignmentCharacter", Leader = "TabList/ListItem/Leader" }

# Properties children the style parser reads as text (`pending_property`),
# with the styles each arm's guard admits.

[[properties_child]]
file = "crates/idml-import/src/styles.rs"
item = "parse_stylesheet"
children = ["AppliedFont", "BasedOn"]
elements = ["CharacterStyle", "ParagraphStyle", "ObjectStyle", "CellStyle", "TableStyle"]

[[properties_child]]
file = "crates/idml-import/src/styles.rs"
item = "parse_stylesheet"
children = ["Leading"]
elements = ["CharacterStyle", "ParagraphStyle"]
coarse_type = "number"

[[properties_child]]
file = "crates/idml-import/src/styles.rs"
item = "parse_stylesheet"
children = [
  "NumberingExpression",
  "NumberingFormat",
  "AppliedNumberingList",
  "SpanSplitColumnCount",
  "BulletsCharacterStyle",
  "NumberingCharacterStyle",
  "BulletsTextAfter",
]
elements = ["ParagraphStyle"]

[[properties_child]]
file = "crates/idml-import/src/designmap.rs"
item = "parse_designmap"
# `<Properties><Destination type="object">` (`PendingProperty`).
children = ["Destination"]
elements = ["Hyperlink"]

[[properties_child]]
file = "crates/idml-import/src/designmap.rs"
item = "parse_designmap"
children = ["PageNumberStyle"]
elements = ["Section"]

# Reads through a computed key.

[[read]]
file = "crates/idml-import/src/spread.rs"
item = "read_corner_attrs"
attributes = [
  "TopLeftCornerOption",
  "TopRightCornerOption",
  "BottomRightCornerOption",
  "BottomLeftCornerOption",
]
# The arms that call `read_corner_attrs`.
elements = ["TextFrame", "Rectangle", "Oval", "Polygon", "GraphicLine", "Group"]
coarse_type = "enum"
field = "CornerSpec.option"

[[read]]
file = "crates/idml-import/src/spread.rs"
item = "read_corner_attrs"
attributes = [
  "TopLeftCornerRadius",
  "TopRightCornerRadius",
  "BottomRightCornerRadius",
  "BottomLeftCornerRadius",
]
elements = ["TextFrame", "Rectangle", "Oval", "Polygon", "GraphicLine", "Group"]
coarse_type = "number"
field = "CornerSpec.radius"

# `parse_paragraph_rule(e, "RuleAbove" | "RuleBelow")` assembles each key
# from the family prefix and a suffix; elements are inferred from its callers.

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAbove", "RuleBelow"]
verify = [""]
coarse_type = "bool"
field = "ParagraphRule.on"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveColor", "RuleBelowColor"]
verify = ["Color"]
coarse_type = "string"
field = "ParagraphRule.color"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveTint", "RuleBelowTint"]
verify = ["Tint"]
coarse_type = "number"
field = "ParagraphRule.tint"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveLineWeight", "RuleBelowLineWeight"]
verify = ["LineWeight"]
coarse_type = "number"
field = "ParagraphRule.weight"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveWeight", "RuleBelowWeight"]
verify = ["Weight"]
coarse_type = "number"
field = "ParagraphRule.weight"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveOffset", "RuleBelowOffset"]
verify = ["Offset"]
coarse_type = "number"
field = "ParagraphRule.offset"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveLeftIndent", "RuleBelowLeftIndent"]
verify = ["LeftIndent"]
coarse_type = "number"
field = "ParagraphRule.left_indent"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveRightIndent", "RuleBelowRightIndent"]
verify = ["RightIndent"]
coarse_type = "number"
field = "ParagraphRule.right_indent"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_rule"
attributes = ["RuleAboveWidth", "RuleBelowWidth"]
verify = ["Width"]
coarse_type = "string"
field = "ParagraphRule.width"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_border"
attributes = ["ParagraphBorderTopLeftCornerOption", "ParagraphBorderTopRightCornerOption", "ParagraphBorderBottomRightCornerOption", "ParagraphBorderBottomLeftCornerOption"]
coarse_type = "enum"
field = "CornerSpec.option"

[[read]]
file = "crates/idml-import/src/styles.rs"
item = "parse_paragraph_border"
attributes = ["ParagraphBorderTopLeftCornerRadius", "ParagraphBorderTopRightCornerRadius", "ParagraphBorderBottomRightCornerRadius", "ParagraphBorderBottomLeftCornerRadius"]
coarse_type = "number"
field = "CornerSpec.radius"

[[read]]
file = "crates/idml-import/src/designmap.rs"
item = "parse_designmap"
# Read once before the match on the part reference's name.
attributes = ["src"]
elements = ["idPkg:Spread", "idPkg:Story", "idPkg:MasterSpread"]

[[ignore]]
file = "crates/idml-import/src/util.rs"
item = "NAMED_ITEM_KINDS"
literals = ["TextFrame", "Rectangle", "Oval", "Polygon", "GraphicLine", "Group"]
reason = "element names, not attributes"

