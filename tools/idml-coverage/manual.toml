# Hand-kept facts the syn walk in tools/idml-coverage cannot see.
#
# Every entry is checked against the code: a literal named here must still
# appear in the item named here, and a fn must still exist, or the tool fails.
# See README.md for what each table means.

# ------------------------------------------------------------- importer

# A function's element(s), where call-site inference cannot tell.

[[fn]]
file = "crates/idml-import/src/story.rs"
name = "make_anchored_frame"
# `anchored_kind_from_name`: the inline-anchored page items.
elements = ["TextFrame", "Rectangle", "Group"]

[[fn]]
file = "crates/idml-import/src/util.rs"
name = "record_item_name"
# `NAMED_ITEM_KINDS`.
elements = ["TextFrame", "Rectangle", "Oval", "Polygon", "GraphicLine", "Group"]

# `(N, b"Child")` arms in the story parser: which element's <Properties>
# kind N is (`properties_kind` = 1 inside a run, 2 inside a paragraph).

[[properties_kind]]
file = "crates/idml-import/src/story.rs"
kind = 1
element = "CharacterStyleRange"

[[properties_kind]]
file = "crates/idml-import/src/story.rs"
kind = 2
element = "ParagraphStyleRange"
# InDesign's record-form tab stop: <TabList><ListItem type="record">.
rename = { Position = "TabList/ListItem/Position", Alignment = "TabList/ListItem/Alignment", AlignmentCharacter = "TabList/ListItem/AlignmentCharacter", Leader = "TabList/ListItem/Leader" }

# Properties children the style parser reads as text (`pending_property`),
# with the styles each arm's guard admits.

[[properties_child]]
file = "crates/idml-import/src/styles.rs"
item = "parse_stylesheet"
children = ["AppliedFont", "BasedOn"]
elements = ["CharacterStyle", "ParagraphStyle", "ObjectStyle", "CellStyle", "TableStyle"]

[[properties_child]]
