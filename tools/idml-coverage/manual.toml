# ------------------------------------------------------------- package parts

# The package part(s) each entry function reads or writes. Its callees
# inherit the parts down the call graph, adding them to their own entry if
# they have one, so only the functions that are handed a part's bytes are
# listed.
# Mapping by file name would be wrong: `parse_chapter_number_preference`
# lives in designmap.rs and reads Preferences.xml. Every importer read and
# exporter write must end up with a part, or it is listed as unresolved.
# Part names are the census's part classes.

