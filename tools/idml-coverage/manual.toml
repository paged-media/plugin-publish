# ------------------------------------------------------------- unseen reads

# Reads of an (element, attribute) that no document in the census carries
# (`census.json`, the corpus census vendored from the docs repo). Each needs
# a reason here; the `idml_coverage_ratchet` test fails when an unjustified
# one appears. `keys` are `Element@Attribute` (any kind); `elements` covers
# every unseen read on an element. A name that is no longer an unseen read
# fails the tool, so the list cannot go stale.

[[unseen]]
reason = "Inside a <Properties> value. The census records the Properties child on its owner (Document@Label, TextFramePreference@InsetSpacing, TextWrapPreference@TextWrapOffset, ParagraphStyleRange@BulletChar and @TabList) and does not descend into the value, so the fields inside are never counted."
elements = ["KeyValuePair", "InsetSpacing", "TextWrapOffset", "BulletChar"]
keys = [
  "ParagraphStyleRange@TabList/ListItem/Alignment",
  "ParagraphStyleRange@TabList/ListItem/AlignmentCharacter",
  "ParagraphStyleRange@TabList/ListItem/Leader",
  "ParagraphStyleRange@TabList/ListItem/Position",
]

[[unseen]]
reason = "InDesign writes these on a <ParagraphStyleRange> whose paragraph sets its spacing itself rather than through its style (asked of InDesign 20.0.1, 2026-10-13: core tools/indesign-export/spelling-and-spacing-probe builds the paragraph in its DOM and exports it; all nine Minimum/Desired/Maximum Word and Letter Spacing and Glyph Scaling land on the range). The census documents set them only on styles, bar one range's letter spacing and four documents' Min/Max glyph scaling."
keys = [
  "ParagraphStyleRange@DesiredGlyphScaling",
  "ParagraphStyleRange@DesiredWordSpacing",
  "ParagraphStyleRange@MaximumWordSpacing",
  "ParagraphStyleRange@MinimumWordSpacing",
]

[[unseen]]
reason = "InDesign writes these lists on a style with GREP or line styles, and on a range whose nested, GREP or line styles differ from its style's (asked of InDesign 20.0.1, 2026-10-12: a document built in its DOM and exported); no census document has one."
keys = [
  "ParagraphStyle@AllGREPStyles",
  "ParagraphStyle@AllLineStyles",
  "ParagraphStyleRange@AllGREPStyles",
  "ParagraphStyleRange@AllLineStyles",
  "ParagraphStyleRange@AllNestedStyles",
]

