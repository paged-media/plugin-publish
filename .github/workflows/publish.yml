# Canary publish of the paged.publish plugin bundles (@paged-media/publish +
# @paged-media/pdf).
#
# AUTH: OIDC TRUSTED PUBLISHING (tokenless) — same lane as plugin-image/
# plugin-web/plugin-sdk. Requires a Trusted Publisher on npm for EACH
# package: org paged-media, this repo, workflow publish.yml. Until that
# npm-side config exists the publish step fails visibly (2026-08-18: the
# legacy NPM_TOKEN here died of expiry — E404-on-PUT is auth — so the
# tokenless lane replaces it rather than rotating a second secret).
#
# Why pnpm pack -> npm publish: `pnpm pack` applies publishConfig (repointing
# main/types to dist); npm does the authenticated upload.
#
# Pre-1.0: every version is a -canary.N prerelease under the `canary`
# dist-tag. An unchanged version skips; bump a bundle's package.json to
# release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # >= 22.14 for OIDC trusted publishing
          registry-url: https://registry.npmjs.org
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" typecheck
      - run: pnpm -r --filter "./packages/*" build # produce dist (pnpm pack skips prepublishOnly)
      - name: publish each bundle whose version is new (canary, via OIDC)
        run: |
          set -e
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            ( cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" )
            tgz="$RUNNER_TEMP/$(echo "$name" | sed 's#@##; s#/#-#')-${version}.tgz"
            echo "publish $name@$version ($tgz) via OIDC"
            npm publish "$tgz" --tag canary --access public
          done
