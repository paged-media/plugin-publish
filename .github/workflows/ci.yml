name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# The IDML adapter git-deps the Paged model crates from the public
# paged-media/core engine repo, so CI fetches core over https (no auth
# needed — both repos are public).
jobs:
  check:
    name: fmt + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build (native)
        run: cargo build --workspace --all-targets

      # The save-back path runs in the editor/SDK wasm, so keep the adapter
      # wasm32-clean; the pdf-import mapper SHIPS as wasm in the pdf bundle.
      - name: build (wasm32)
        run: cargo build -p idml-import -p idml-export -p pdf-import --target wasm32-unknown-unknown

  # The TS side — the paged.publish plugin bundle (packages/publish-bundle),
  # which consumes the published @paged-media/plugin-api + plugin-sdk canaries.
  bundle:
    name: bundles typecheck + build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" typecheck
      - run: pnpm -r --filter "./packages/*" build
      - name: validate every bundle manifest
        run: |
          set -e
          for m in packages/*/manifest.json; do
            echo "== validate $m =="
            npx --yes @paged-media/plugin-cli@canary validate "$m"
          done

  # Test evidence — the suites this repo has always had and CI never ran.
  # `check` covers fmt/clippy/build and `bundle` covers typecheck/build, so a
  # green run said nothing about whether the 170 Rust tests (pdf-import,
  # idml-import) or the pdf-bundle vitest specs still passed. The state matrix
  # read plugin.publish "never published" for the same reason.
  #
  # Evidence hand-off is INVERTED (2026-07-26): this repo is PUBLIC and the
  # state repo is PRIVATE, so it cannot resolve state's publish-results action
  # from a public workflow. We upload; state pulls (siblings-pull.yml).
  tests:
    name: tests (evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Mirrors rust-toolchain.toml — dtolnay's action does NOT read that
          # file and hard-fails without an explicit toolchain.
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Red results must still publish (the matrix wants the ✗), so the run
      # does not abort here — the gate at the end fails the build once the
      # artifacts are safely uploaded.
      - name: nextest → JUnit
        run: |
          set -uo pipefail
          cargo nextest run --profile ci || echo "RUST_FAILED=1" >> "$GITHUB_ENV"
          test -s target/nextest/ci/junit.xml

      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only packages that DECLARE a test script. `pnpm -r exec vitest run`
      # runs it everywhere, and vitest exits non-zero in a package with no
      # test files ("No test files found") — which set the failure flag on the
      # first run here even though all 170 Rust and 18 TS tests passed. A gate
      # that fires on a package having no tests is a gate nobody will believe.
      - name: vitest → JUnit
        run: |
          set -uo pipefail
          for d in packages/*/; do
            node -e "process.exit(require('./${d}package.json').scripts?.test ? 0 : 1)" \
              2>/dev/null || continue
            echo "== vitest in $d"
            (cd "$d" && pnpm exec vitest run --reporter=default \
              --reporter=junit --outputFile=junit.xml) \
              || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          done
          ls packages/*/junit.xml

      # PER-PACKAGE artifacts, one junit.xml each — never cat them together.
      # The old merged junit-all.xml carried package-RELATIVE classnames, so
      # the state matrix could not tell a pdf-bundle test from a
      # publish-bundle one and its declared plugin-pdf/vitest lane sat
      # "never published" (state ingest/artifacts.yaml, 2026-08-17 audit).
      # Artifact names pair with state's pull table: vitest-junit-<package>.
      - name: upload pdf-bundle vitest artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-pdf-bundle
          path: packages/pdf-bundle/junit.xml
          if-no-files-found: error
          retention-days: 14

      # publish-bundle declares no test script yet, so this uploads nothing
      # today (warn, not error) — the lane starts feeding the day its first
      # vitest lands, with no workflow change.
      - name: upload publish-bundle vitest artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-publish-bundle
          path: packages/publish-bundle/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: tests failed
        if: ${{ env.RUST_FAILED == '1' || env.TS_FAILED == '1' }}
        run: exit 1
