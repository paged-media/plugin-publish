  "TopLeftCornerRadius",
  "TopRightCornerRadius",
  "BottomRightCornerRadius",
  "BottomLeftCornerRadius",
]
elements = ["TextFrame", "Rectangle", "Oval", "Polygon", "GraphicLine", "Group"]
coarse_type = "number"
field = "CornerSpec.radius"

# The inactive-state skip tests `State@Active` in the same condition as the
# element name, which the walk does not take as element context.
[[read]]
file = "crates/idml-import/src/spread.rs"
item = "parse_spread_with_provenance"
attributes = ["Active"]
elements = ["State"]
coarse_type = "bool"

